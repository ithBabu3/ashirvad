<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1322">
<meta name="robots" content="noindex, nofollow">
<title>Distributor — AshirvadConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1322;--navy2:#10192c;--gold:#c9a24d;--gold2:#e6c878;--maroon:#7c2333;--ivory:#faf6ec;--ink:#1d1a14;--ink2:#5c5346;--line:#e6dcc3;--ok:#1f7a3f;--warn:#b7791f;--bad:#a12626}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--ivory);color:var(--ink);font-size:14px;padding-bottom:env(safe-area-inset-bottom)}
.d-none{display:none!important}
.brand{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:#fff}.brand b{color:var(--gold2)}
/* login */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,var(--navy),var(--maroon))}
.card{background:#fff;border-radius:16px;max-width:380px;width:100%;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card-head{background:var(--navy);padding:22px;text-align:center;border-bottom:2px solid var(--gold)}
.card-head small{display:block;color:#cfc6ad;letter-spacing:.14em;font-size:11px;margin-top:2px}
.card-body{padding:20px}
label{display:block;font-size:12px;font-weight:500;margin:10px 0 4px;color:var(--ink2)}
input,select,textarea{width:100%;border:1.3px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:#fff}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;background:var(--navy);color:#fff;cursor:pointer}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1.3px solid var(--line)}
.btn.block{width:100%;margin-top:14px}.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:8px}
/* app */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:2px solid var(--gold)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{font-size:12px;color:#cfc6ad}.who b{color:#fff}
.wrap{max-width:860px;margin:0 auto;padding:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px}
.chip b{display:block;font-size:18px;font-family:'Cormorant Garamond',serif}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1;min-width:150px}.tools select{width:auto}
.rc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.rc.low{border-left:4px solid var(--warn)}.rc.oos{border-left:4px solid var(--bad)}.rc.dirty{background:#fffbe9;border-color:var(--gold)}
.rn{font-weight:600}.rs{font-size:12px;color:var(--ink2)}.rp{font-size:12.5px;margin-top:3px;color:var(--maroon);font-weight:600}
.stk{display:flex;align-items:center;gap:4px}
.stk button{width:34px;height:36px;border:1.3px solid var(--line);background:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.stk input{width:76px;text-align:center;font-weight:600}
.rf{grid-column:1/-1;font-size:11.5px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border-radius:99px;padding:1px 8px;font-size:10.5px;font-weight:600}
.pill.low{background:#fdf0d5;color:var(--warn)}.pill.oos{background:#fbdede;color:var(--bad)}.pill.ok{background:#dff3e6;color:var(--ok)}.pill.pend{background:#e7eefc;color:#2b4f9e}
#saveBar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:30;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
h3{font-family:'Cormorant Garamond',serif;font-size:20px;margin:18px 0 8px}
.empty{text-align:center;color:var(--ink2);padding:30px 10px}
.ov{position:fixed;inset:0;background:rgba(10,19,34,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.ov .box{background:#fff;border-radius:14px;max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:18px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:99px;z-index:99;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="card">
    <div class="card-head"><div class="brand">Ashirvad<b>Connect</b></div><small>DISTRIBUTOR PORTAL</small></div>
    <form class="card-body" id="loginForm" autocomplete="off">
      <label for="dUser">Distributor ID</label>
      <input id="dUser" autocapitalize="none" autocorrect="off" placeholder="e.g. sharma-traders">
      <label for="dPass">Password</label>
      <input id="dPass" type="password">
      <div class="err" id="loginErr"></div>
      <button class="btn gold block" id="loginBtn" type="submit">Login</button>
    </form>
  </div>
</div>

<div id="appWrap" class="d-none">
  <header>
    <div class="hrow">
      <div><div class="brand" style="font-size:19px">Ashirvad<b>Connect</b></div><div class="who" id="who"></div></div>
      <button class="btn ghost" id="logoutBtn" style="padding:6px 12px">Log out</button>
    </div>
  </header>
  <div class="wrap" id="view"></div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/vendor/xlsx.mini.js?v=3"></script>
<script src="../js/firebase-config.js?v=3"></script>
<script src="../js/distributor.js?v=3"></script>
</body>
</html>
